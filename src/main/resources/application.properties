spring.application.name=ipl-prediction
spring.profiles.active=dev

# Tournament prediction cutoff (IST)
tournament.prediction.cutoff=2026-05-25T00:00:00

# Tournament result update allowed after (IST)
tournament.result.allowed-after=2026-06-01T00:00:00

# Points per correct tournament prediction
tournament.prediction.points-per-question=5

# Hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Expose the health endpoint
management.endpoints.web.exposure.include=health

# Show detailed health information (optional)
management.endpoint.health.show-details=always
